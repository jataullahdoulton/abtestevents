<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Experiment event platform</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  body { margin: 0; background: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
</style>
</head>
<body>
<div id="app" class="w-full max-w-4xl mx-auto p-6 space-y-5"></div>

<script>
const SUPABASE_URL = 'https://pzrnopycnrebsayjjllk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_eXjpOQEb7O3mRo-ohUKUZg_1s10Sywh';
const headers = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' };
const VARIANT_COLORS = { control: '#64748B', variant_a: '#4338CA' };

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let realtimeChannel = null;

let state = {
  view: 'picker',
  experiments: [],
  events: [],
  eventCounts: {},
  allEventNames: [],
  testId: null,
  selectedEvent: null,
  rangeDays: 14,
  customFrom: '',
  customTo: '',
  useCustomRange: false,
  device: 'all',
  funnel: [],
  series: [],
  overviewSeries: [],
  overviewChart: null,
  chart: null,
  showAddTest: false,
  addTestError: '',
  editingTestId: null,
  confirmingDeleteId: null,
  showAddEvent: false,
  addEventError: '',
  addEventProgression: [],
  addEventType: 'click',
  liveConnected: false,
  livePulse: true,
  lastLiveEvent: null,
};

async function api(path, opts) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, { headers, ...opts });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function loadExperiments() {
  state.experiments = await api('experiments?select=*&order=created_at.asc');
  const te = await api('tracked_events?select=id,name,experiment_id');
  state.eventCounts = {};
  te.forEach(e => {
    if (e.experiment_id) state.eventCounts[e.experiment_id] = (state.eventCounts[e.experiment_id] || 0) + 1;
  });
  state.allEventNames = te.map(e => e.name);
}

async function loadEventsForTest(testId) {
  state.events = await api('tracked_events?select=*&experiment_id=eq.' + testId + '&order=created_at.asc');
  const te = await api('tracked_events?select=name');
  state.allEventNames = te.map(e => e.name);
}

function bucketLabel(createdAt) {
  const d = new Date(createdAt);
  return state.rangeDays === 'today' && !state.useCustomRange
    ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    : d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

async function loadTestOverview() {
  if (!state.events.length) { state.overviewSeries = []; return; }

  const { fromDate, toDate } = getActiveRange();
  const devicePayload = state.device === 'all' ? null : state.device;
  const eventNames = state.events.map(e => e.name);

  let query = 'experiment_events?select=variant,created_at&event_name=in.(' +
    eventNames.map(n => encodeURIComponent(n)).join(',') + ')' +
    '&created_at=gte.' + encodeURIComponent(fromDate) + '&order=created_at.asc';
  if (toDate) query += '&created_at=lte.' + encodeURIComponent(toDate);
  if (devicePayload) query += '&device_type=eq.' + encodeURIComponent(devicePayload);

  const rows = await api(query);
  const byDay = {};
  rows.forEach(r => {
    const day = bucketLabel(r.created_at);
    if (!byDay[day]) byDay[day] = { date: day, control: 0, variant_a: 0 };
    byDay[day][r.variant || 'unknown'] = (byDay[day][r.variant || 'unknown'] || 0) + 1;
  });
  state.overviewSeries = Object.values(byDay);
}

async function loadFunnelAndSeries() {
  const evt = state.events.find(e => e.name === state.selectedEvent);
  if (!evt) { state.funnel = []; state.series = []; return; }

  const { fromDate, toDate } = getActiveRange();
  const devicePayload = state.device === 'all' ? null : state.device;

  // Find the funnel this event actually starts, by looking at funnel_steps
  // directly rather than guessing a name, evt.name + '_progression' was
  // fragile and silently broke for anything not following that pattern.
  const stepMatch = await api(
    'funnel_steps?select=funnel_id&step_order=eq.1&event_name=eq.' + encodeURIComponent(evt.name)
  );

  if (stepMatch && stepMatch[0]) {
    const rows = await api('rpc/get_funnel_report', {
      method: 'POST',
      body: JSON.stringify({
        p_funnel_id: stepMatch[0].funnel_id,
        p_device: devicePayload,
        p_start_date: fromDate,
        p_end_date: toDate,
      }),
    });
    const byStep = {};
    rows.forEach(r => {
      if (!byStep[r.step_order]) byStep[r.step_order] = { name: r.event_name, control: 0, variant_a: 0 };
      byStep[r.step_order][r.variant || 'unknown'] = r.sessions;
    });
    state.funnel = Object.values(byStep);
  } else {
    state.funnel = [];
  }

  let seriesQuery = 'experiment_events?select=variant,created_at&event_name=eq.' + encodeURIComponent(evt.name) +
    '&created_at=gte.' + encodeURIComponent(fromDate) + '&order=created_at.asc';
  if (toDate) seriesQuery += '&created_at=lte.' + encodeURIComponent(toDate);
  if (devicePayload) seriesQuery += '&device_type=eq.' + encodeURIComponent(devicePayload);

  const rows = await api(seriesQuery);
  const byDay = {};
  rows.forEach(r => {
    const day = bucketLabel(r.created_at);
    if (!byDay[day]) byDay[day] = { date: day, control: 0, variant_a: 0 };
    byDay[day][r.variant || 'unknown'] = (byDay[day][r.variant || 'unknown'] || 0) + 1;
  });
  state.series = Object.values(byDay);
}

function getActiveRange() {
  if (state.useCustomRange && state.customFrom) {
    const fromDate = new Date(state.customFrom + 'T00:00:00Z').toISOString();
    const toDate = state.customTo ? new Date(state.customTo + 'T23:59:59Z').toISOString() : null;
    return { fromDate, toDate };
  }
  if (state.rangeDays === 'today') {
    const startOfToday = new Date();
    startOfToday.setHours(0, 0, 0, 0);
    return { fromDate: startOfToday.toISOString(), toDate: null };
  }
  return { fromDate: new Date(Date.now() - state.rangeDays * 86400000).toISOString(), toDate: null };
}

async function createExperiment(name, shopliftKey) {
  const rows = await fetch(SUPABASE_URL + '/rest/v1/experiments', {
    method: 'POST',
    headers: { ...headers, Prefer: 'return=representation' },
    body: JSON.stringify({
      name, shoplift_key: shopliftKey,
      variant_labels: { '0': 'control', '1': 'variant_a' }, status: 'running',
    }),
  }).then(r => r.json());
  return rows[0];
}

async function updateExperiment(id, name, shopliftKey) {
  const rows = await fetch(SUPABASE_URL + '/rest/v1/experiments?id=eq.' + id, {
    method: 'PATCH',
    headers: { ...headers, Prefer: 'return=representation' },
    body: JSON.stringify({ name, shoplift_key: shopliftKey }),
  }).then(r => r.json());
  return rows[0];
}

async function deleteExperiment(id) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/experiments?id=eq.' + id, {
    method: 'DELETE',
    headers,
  });
  if (!res.ok) throw new Error(await res.text());
}

async function createTrackedEvent(experimentId, name, type, target, progression) {
  const rows = await fetch(SUPABASE_URL + '/rest/v1/tracked_events', {
    method: 'POST',
    headers: { ...headers, Prefer: 'return=representation' },
    body: JSON.stringify({ name, event_type: type, match_type: type === 'pageview' ? 'url_path' : 'selector', match_value: target, experiment_id: experimentId }),
  }).then(r => r.json());

  if (progression.length) {
    const fdRows = await fetch(SUPABASE_URL + '/rest/v1/funnel_definitions', {
      method: 'POST',
      headers: { ...headers, Prefer: 'return=representation' },
      body: JSON.stringify({ name: name + '_progression' }),
    }).then(r => r.json());
    const funnelId = fdRows[0].id;
    const steps = [name, ...progression].map((stepName, i) => ({ funnel_id: funnelId, step_order: i + 1, event_name: stepName }));
    await fetch(SUPABASE_URL + '/rest/v1/funnel_steps', {
      method: 'POST',
      headers,
      body: JSON.stringify(steps),
    });
  }
  return rows[0];
}

function subscribeRealtime() {
  if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
  realtimeChannel = supabaseClient
    .channel('experiment_events_live')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'experiment_events' }, async (payload) => {
      state.lastLiveEvent = payload.new;
      const evt = state.events.find(e => e.name === state.selectedEvent);
      const belongsToTest = state.events.some(e => e.name === payload.new.event_name);
      if (evt && payload.new.event_name === evt.name) {
        await loadFunnelAndSeries();
      }
      if (belongsToTest) {
        await loadTestOverview();
      }
      renderLiveOnly();
    })
    .subscribe((status) => {
      state.liveConnected = status === 'SUBSCRIBED';
      renderLiveOnly();
    });
  setInterval(() => { state.livePulse = !state.livePulse; renderLiveOnly(); }, 800);
}

function renderLiveOnly() {
  if (state.view !== 'test') return;
  const dot = document.getElementById('liveDot');
  if (dot) {
    dot.style.background = state.liveConnected ? '#10B981' : '#CBD5E1';
    dot.style.opacity = state.liveConnected && state.livePulse ? '1' : '0.3';
  }
  const label = document.getElementById('liveLabel');
  if (label) label.textContent = state.liveConnected
    ? (state.lastLiveEvent ? 'live \u2014 last: ' + state.lastLiveEvent.event_name : 'live')
    : 'connecting\u2026';
  const overviewDot = document.getElementById('overviewLiveDot');
  if (overviewDot) {
    overviewDot.style.background = state.liveConnected ? '#10B981' : '#CBD5E1';
    overviewDot.style.opacity = state.liveConnected && state.livePulse ? '1' : '0.3';
  }
  const overviewPanel = document.getElementById('overviewPanel');
  if (overviewPanel) overviewPanel.innerHTML = renderOverviewPanelInner();
  const funnelPanel = document.getElementById('funnelPanel');
  if (funnelPanel) funnelPanel.innerHTML = renderFunnelPanelInner();
  if (document.getElementById('seriesChart')) drawChart();
  if (document.getElementById('overviewChart')) drawOverviewChart();
}

function badge(text, tone) {
  const tones = { neutral: 'bg-slate-100 text-slate-500', accent: 'bg-indigo-50 text-indigo-700', live: 'bg-emerald-50 text-emerald-700', ended: 'bg-slate-100 text-slate-400' };
  return '<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-medium tracking-wide ' + (tones[tone] || tones.neutral) + '">' + text + '</span>';
}

function renderPicker() {
  const rows = state.experiments.map(t => {
    if (state.confirmingDeleteId === t.id) {
      return (
        '<div class="w-full flex items-center justify-between bg-rose-50 border border-rose-200 rounded-lg p-4">' +
          '<div><p class="text-sm font-medium text-rose-900">Delete "' + t.name + '"?</p>' +
          '<p class="text-[11px] text-rose-500 mt-0.5">This removes the test and its tracked events. Shared funnel history and raw event logs are kept.</p></div>' +
          '<div class="flex items-center gap-2 shrink-0 ml-3">' +
            '<button data-confirm-delete-test="' + t.id + '" class="text-xs font-medium bg-rose-600 text-white rounded-md px-3 py-1.5 hover:bg-rose-700">Delete</button>' +
            '<button data-cancel-delete-test class="text-xs text-slate-500 rounded-md px-3 py-1.5 hover:bg-slate-100">Cancel</button>' +
          '</div>' +
        '</div>'
      );
    }
    return (
      '<div data-open-test="' + t.id + '" class="w-full flex items-center justify-between bg-white border border-slate-200 rounded-lg p-4 shadow-sm hover:border-indigo-300 hover:shadow cursor-pointer">' +
        '<div><p class="text-sm font-medium text-slate-900">' + t.name + '</p></div>' +
        '<div class="flex items-center gap-3">' +
          '<span class="text-[11px] text-slate-400">' + (state.eventCounts[t.id] || 0) + ' events tracked</span>' +
          badge(t.status, t.status === 'running' ? 'live' : 'ended') +
          '<button data-edit-test="' + t.id + '" class="text-slate-400 hover:text-indigo-700 text-xs px-1" title="Edit test">&#9998;</button>' +
          '<button data-delete-test="' + t.id + '" class="text-slate-400 hover:text-rose-600 text-xs px-1" title="Delete test">&#128465;</button>' +
        '</div>' +
      '</div>'
    );
  }).join('');

  const editing = state.editingTestId ? state.experiments.find(t => t.id === state.editingTestId) : null;
  const formOpen = state.showAddTest || editing;

  const addForm = formOpen ? (
    '<div class="mb-4 p-3.5 bg-white border border-slate-200 rounded-lg space-y-2.5 shadow-sm">' +
      '<p class="text-[11px] font-semibold text-slate-500 uppercase tracking-wide">' + (editing ? 'Edit test' : 'New test') + '</p>' +
      '<div><label class="text-[11px] text-slate-500 block mb-1">Test name</label>' +
      '<input id="newTestName" value="' + (editing ? editing.name : '') + '" placeholder="Homepage redesign" class="w-full text-xs border border-slate-300 rounded-md px-2 py-1.5" /></div>' +
      '<div><label class="text-[11px] text-slate-500 block mb-1">Shoplift test ID</label>' +
      '<input id="newTestKey" value="' + (editing ? (editing.shoplift_key || '') : '') + '" placeholder="01a01438-0ad4-7367-b76b-d8a41e1be3b0" class="w-full text-xs border border-slate-300 rounded-md px-2 py-1.5 font-mono" />' +
      '<p class="text-[10px] text-slate-400 mt-1">Open the console on a page in this test and run <code>await window.shoplift.getVisitorData()</code>, copy testId from visitorTests. Control vs variant is read live from Shoplift, nothing else to configure.</p></div>' +
      (state.addTestError ? '<p class="text-xs text-rose-600">' + state.addTestError + '</p>' : '') +
      '<div class="flex gap-2 pt-1">' +
        '<button data-save-test="' + (editing ? editing.id : '') + '" class="text-xs font-medium bg-indigo-700 text-white rounded-md px-3 py-1.5 hover:bg-indigo-800">' + (editing ? 'Save changes' : 'Save test') + '</button>' +
        '<button data-cancel-test class="text-xs text-slate-500 rounded-md px-3 py-1.5 hover:bg-slate-100">Cancel</button>' +
      '</div>' +
    '</div>'
  ) : '';

  return (
    '<div>' +
      '<div class="flex items-center justify-between mb-0.5">' +
        '<h1 class="text-[15px] font-semibold text-slate-900 tracking-tight">Event platform</h1>' +
        '<button data-toggle-add-test class="text-xs font-medium text-indigo-700 hover:text-indigo-800">+ Add test</button>' +
      '</div>' +
      '<p class="text-xs text-slate-400 mt-0.5 mb-4">doulton.com &middot; pick a test to see its events</p>' +
      addForm +
      '<div class="space-y-2.5">' + (rows || '<p class="text-xs text-slate-400">No tests set up yet.</p>') + '</div>' +
    '</div>'
  );
}

function renderFunnelPanelInner() {
  const evt = state.events.find(e => e.name === state.selectedEvent);
  const test = state.experiments.find(t => t.id === state.testId);
  if (!evt) return '<p class="text-xs text-slate-400 text-center py-10">Pick an event on the left to see its performance for this test.</p>';

  const funnelRows = state.funnel.map((s, i) => {
    const max = state.funnel[0] ? (state.funnel[0].control + state.funnel[0].variant_a) : 1;
    const stepUplift = s.control ? Math.round(((s.variant_a - s.control) / s.control) * 100) : 0;
    return (
      '<div>' +
        '<div class="flex items-center justify-between mb-1">' +
          '<p class="text-[11px] font-mono text-slate-500">' + (i === 0 ? evt.name + ' (start)' : s.name) + '</p>' +
          '<span class="text-[11px] font-medium tabular-nums ' + (stepUplift >= 0 ? 'text-emerald-600' : 'text-rose-600') + '">' + (stepUplift >= 0 ? '+' : '') + stepUplift + '%</span>' +
        '</div>' +
        ['control', 'variant_a'].map(v => (
          '<div class="flex items-center gap-2 mb-1">' +
            '<div class="flex-1 bg-slate-100 rounded h-4 relative overflow-hidden"><div class="h-full rounded" style="width:' + ((s[v] || 0) / (max / 2) * 100) + '%;background:' + VARIANT_COLORS[v] + '"></div></div>' +
            '<span class="text-xs w-10 text-right tabular-nums text-slate-700">' + (s[v] || 0) + '</span>' +
          '</div>'
        )).join('') +
      '</div>'
    );
  }).join('');

  const convC = state.funnel.length > 1 && state.funnel[0].control ? Math.round((state.funnel[state.funnel.length - 1].control / state.funnel[0].control) * 100) : 0;
  const convV = state.funnel.length > 1 && state.funnel[0].variant_a ? Math.round((state.funnel[state.funnel.length - 1].variant_a / state.funnel[0].variant_a) * 100) : 0;

  return (
    '<div class="flex items-center justify-between mb-1">' +
      '<div><p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Progression beyond this event</p>' +
      '<p class="text-sm font-mono text-slate-800 mt-0.5">' + evt.name + '</p></div>' +
      badge(test ? test.name : '', 'accent') +
    '</div>' +
    (state.funnel.length > 1
      ? (
        '<div class="flex items-center gap-4 text-xs text-slate-500 mt-3 mb-3">' +
          '<span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm inline-block" style="background:' + VARIANT_COLORS.control + '"></span>control converts <span class="font-mono text-slate-700">' + convC + '%</span></span>' +
          '<span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm inline-block" style="background:' + VARIANT_COLORS.variant_a + '"></span>variant_a converts <span class="font-mono text-slate-700">' + convV + '%</span></span>' +
          '<span class="font-medium ' + (convV >= convC ? 'text-emerald-600' : 'text-rose-600') + '">' + (convV >= convC ? '+' : '') + (convV - convC) + 'pt</span>' +
        '</div>' +
        '<div class="space-y-3 mb-5">' + funnelRows + '</div>'
      )
      : '<p class="text-xs text-slate-400 mt-4 py-6 text-center">No progression steps defined for this event yet in funnel_steps.</p>'
    ) +
    '<p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide mb-2">' + (evt.event_type === 'click' ? 'Clicks' : 'Views') + ' over time</p>' +
    (state.series.length
      ? '<div style="position:relative;height:200px"><canvas id="seriesChart" role="img" aria-label="Line chart of ' + evt.name + ' events over time, control versus variant_a"></canvas></div>'
      : '<p class="text-xs text-slate-400 py-6 text-center">No events recorded yet for this range.</p>'
    )
  );
}

function renderTestDetail() {
  const test = state.experiments.find(t => t.id === state.testId);

  const eventRows = state.events.length
    ? state.events.map(e => (
        '<button data-select-event="' + e.name + '" class="flex items-center justify-between py-2.5 border-t border-slate-100 first:border-t-0 text-left w-full px-1.5 -mx-1.5 rounded ' +
        (state.selectedEvent === e.name ? 'bg-indigo-50/60' : 'hover:bg-slate-50') + '">' +
          '<div class="min-w-0"><p class="text-xs font-mono text-slate-800 truncate">' + e.name + '</p>' +
          '<p class="text-[11px] text-slate-400 truncate">' + e.event_type + ' &middot; ' + e.match_value + '</p></div>' +
          '<span class="w-1.5 h-1.5 rounded-full shrink-0 ml-2 ' + (e.active ? 'bg-emerald-500' : 'bg-slate-300') + '"></span>' +
        '</button>'
      )).join('')
    : '<p class="text-xs text-slate-400 py-4 text-center">No events set up for this test yet.</p>';

  const rangeButtons =
    '<button data-range="today" class="text-xs px-2.5 py-1 rounded-md ' +
    (!state.useCustomRange && state.rangeDays === 'today' ? 'bg-indigo-700 text-white' : 'text-slate-500 hover:bg-slate-50') + '">Today</button>' +
    [7, 14, 30].map(d => (
      '<button data-range="' + d + '" class="text-xs px-2.5 py-1 rounded-md ' +
      (!state.useCustomRange && state.rangeDays === d ? 'bg-indigo-700 text-white' : 'text-slate-500 hover:bg-slate-50') + '">' + d + 'd</button>'
    )).join('') +
    '<button data-toggle-custom-range class="text-xs px-2.5 py-1 rounded-md ' +
    (state.useCustomRange ? 'bg-indigo-700 text-white' : 'text-slate-500 hover:bg-slate-50') + '">Custom</button>';

  const customRangeInputs = state.useCustomRange ? (
    '<div class="flex items-center gap-1.5 bg-white border border-slate-200 rounded-lg px-2 py-1">' +
      '<input type="date" id="customFromInput" value="' + state.customFrom + '" class="text-xs border-none outline-none text-slate-600" />' +
      '<span class="text-slate-300 text-xs">&rarr;</span>' +
      '<input type="date" id="customToInput" value="' + state.customTo + '" class="text-xs border-none outline-none text-slate-600" />' +
      '<button data-apply-custom-range class="text-xs font-medium text-indigo-700 px-2">Apply</button>' +
    '</div>'
  ) : '';

  const deviceButtons = ['all', 'desktop', 'mobile'].map(d => (
    '<button data-device="' + d + '" class="text-xs px-2.5 py-1 rounded-md ' +
    (state.device === d ? 'bg-indigo-700 text-white' : 'text-slate-500 hover:bg-slate-50') + '">' + (d === 'all' ? 'All devices' : d[0].toUpperCase() + d.slice(1)) + '</button>'
  )).join('');

  return (
    '<div>' +
      '<button data-back class="text-[11px] text-slate-400 hover:text-slate-600 mb-1">&larr; All tests</button>' +
      '<div class="flex items-center justify-between mb-3">' +
        '<div><h1 class="text-[15px] font-semibold text-slate-900 tracking-tight">' + (test ? test.name : '') + '</h1>' +
        '<p class="text-xs text-slate-400 mt-0.5 font-mono">' + (test ? test.shoplift_key : '') + '</p></div>' +
        badge(test ? test.status : '', test && test.status === 'running' ? 'live' : 'ended') +
      '</div>' +
      '<div class="flex items-center gap-2 mb-5 flex-wrap">' +
        '<div class="inline-flex bg-white border border-slate-200 rounded-lg p-0.5">' + rangeButtons + '</div>' +
        customRangeInputs +
        (!state.useCustomRange ? '<span class="text-[11px] text-slate-400 ml-1">' + (state.rangeDays === 'today' ? 'today' : 'last ' + state.rangeDays + ' days') + '</span>' : '') +
        '<div class="inline-flex bg-white border border-slate-200 rounded-lg p-0.5 ml-1">' + deviceButtons + '</div>' +
      '</div>' +
      '<div id="overviewPanel" class="bg-white border border-slate-200 rounded-lg p-5 shadow-sm mb-5">' + renderOverviewPanelInner() + '</div>' +
      '<div class="grid grid-cols-2 gap-5 mb-5">' +
        '<div class="bg-white border border-slate-200 rounded-lg p-5 shadow-sm">' +
          '<div class="flex items-center justify-between mb-4">' +
            '<p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Events for this test</p>' +
            '<button data-toggle-add-event class="text-xs font-medium text-indigo-700 hover:text-indigo-800">+ Add event</button>' +
          '</div>' +
          renderAddEventForm() +
          '<div class="flex flex-col">' + eventRows + '</div>' +
        '</div>' +
        '<div class="bg-white border border-slate-200 rounded-lg p-5 shadow-sm">' +
          '<div class="flex items-center gap-2 mb-2">' +
            '<span id="liveDot" style="width:6px;height:6px;border-radius:50%;display:inline-block;background:#CBD5E1"></span>' +
            '<p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Live connection</p>' +
          '</div>' +
          '<p id="liveLabel" class="text-xs text-slate-400">connecting&hellip;</p>' +
          '<p class="text-[10px] text-slate-300 mt-2">Numbers below update automatically as events land, no refresh needed.</p>' +
        '</div>' +
      '</div>' +
      '<div id="funnelPanel" class="bg-white border border-slate-200 rounded-lg p-5 shadow-sm">' + renderFunnelPanelInner() + '</div>' +
    '</div>'
  );
}

function renderAddEventForm() {
  if (!state.showAddEvent) return '';
  const typeOptions = ['click', 'pageview'].map(t =>
    '<option value="' + t + '"' + (state.addEventType === t ? ' selected' : '') + '>' + (t === 'click' ? 'Click' : 'Pageview') + '</option>'
  ).join('');
  const progressionChips = state.allEventNames
    .filter(name => name !== (document.getElementById('newEventName') ? document.getElementById('newEventName').value.trim() : ''))
    .map(name => {
    const on = state.addEventProgression.includes(name);
    return '<button type="button" data-toggle-progression="' + name + '" class="text-[11px] font-mono px-2 py-1 rounded border ' +
      (on ? 'bg-indigo-50 border-indigo-200 text-indigo-700' : 'bg-white border-slate-300 text-slate-500') + '">' + name + '</button>';
  }).join('');

  return (
    '<div class="mb-4 p-3.5 bg-slate-50 border border-slate-200 rounded-lg space-y-2.5">' +
      '<div><label class="text-[11px] text-slate-500 block mb-1">Event name</label>' +
      '<input id="newEventName" placeholder="click_hero_shop_now" class="w-full text-xs border border-slate-300 rounded-md px-2 py-1.5 font-mono" /></div>' +
      '<div class="flex gap-2">' +
        '<div class="flex-1"><label class="text-[11px] text-slate-500 block mb-1">Type</label>' +
        '<select id="newEventType" class="w-full text-xs border border-slate-300 rounded-md px-2 py-1.5 bg-white">' + typeOptions + '</select></div>' +
        '<div class="flex-[2]"><label class="text-[11px] text-slate-500 block mb-1">' + (state.addEventType === 'pageview' ? 'URL path' : 'CSS selector') + '</label>' +
        '<input id="newEventTarget" placeholder="' + (state.addEventType === 'pageview' ? '/cart' : '#hero-shop-now') + '" class="w-full text-xs border border-slate-300 rounded-md px-2 py-1.5 font-mono" /></div>' +
      '</div>' +
      '<div><label class="text-[11px] text-slate-500 block mb-1">What happens after this event</label>' +
      '<p class="text-[10px] text-slate-400 mb-1.5">Pick what counts as progression, specific to this test.</p>' +
      '<div class="flex flex-wrap gap-1.5">' + progressionChips + '</div></div>' +
      (state.addEventError ? '<p class="text-xs text-rose-600">' + state.addEventError + '</p>' : '') +
      '<div class="flex gap-2 pt-1">' +
        '<button data-save-event class="text-xs font-medium bg-indigo-700 text-white rounded-md px-3 py-1.5 hover:bg-indigo-800">Save event</button>' +
        '<button data-cancel-event class="text-xs text-slate-500 rounded-md px-3 py-1.5 hover:bg-slate-100">Cancel</button>' +
      '</div>' +
    '</div>'
  );
}

function renderOverviewPanelInner() {
  const totalControl = state.overviewSeries.reduce((a, s) => a + (s.control || 0), 0);
  const totalVariant = state.overviewSeries.reduce((a, s) => a + (s.variant_a || 0), 0);
  const uplift = totalControl ? Math.round(((totalVariant - totalControl) / totalControl) * 100) : 0;

  return (
    '<div class="flex items-center justify-between mb-1">' +
      '<div>' +
        '<div class="flex items-center gap-2">' +
          '<span id="overviewLiveDot" style="width:6px;height:6px;border-radius:50%;display:inline-block;background:#CBD5E1"></span>' +
          '<p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">All events, this test</p>' +
        '</div>' +
        '<p class="text-sm text-slate-800 mt-0.5">Control vs variant, updates live as events land</p>' +
      '</div>' +
      '<div class="flex gap-3 text-xs text-slate-500">' +
        '<span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm inline-block" style="background:' + VARIANT_COLORS.control + '"></span>control &middot; <span class="font-mono text-slate-700">' + totalControl + '</span></span>' +
        '<span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm inline-block" style="background:' + VARIANT_COLORS.variant_a + '"></span>variant_a &middot; <span class="font-mono text-slate-700">' + totalVariant + '</span></span>' +
        '<span class="font-medium ' + (uplift >= 0 ? 'text-emerald-600' : 'text-rose-600') + '">' + (uplift >= 0 ? '+' : '') + uplift + '%</span>' +
      '</div>' +
    '</div>' +
    (state.overviewSeries.length
      ? '<div style="position:relative;height:200px" class="mt-3"><canvas id="overviewChart" role="img" aria-label="Line chart of all tracked events for this test over time, control versus variant_a"></canvas></div>'
      : '<p class="text-xs text-slate-400 py-8 text-center">No events recorded yet for this range.</p>'
    )
  );
}

function drawOverviewChart() {
  if (state.overviewChart) { state.overviewChart.destroy(); state.overviewChart = null; }
  const canvas = document.getElementById('overviewChart');
  if (!canvas || !state.overviewSeries.length) return;
  state.overviewChart = new Chart(canvas, {
    type: 'line',
    data: {
      labels: state.overviewSeries.map(s => s.date),
      datasets: [
        { label: 'control', data: state.overviewSeries.map(s => s.control || 0), borderColor: VARIANT_COLORS.control, backgroundColor: 'transparent', tension: 0.3 },
        { label: 'variant_a', data: state.overviewSeries.map(s => s.variant_a || 0), borderColor: VARIANT_COLORS.variant_a, backgroundColor: 'transparent', tension: 0.3 },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            afterBody: (items) => {
              const c = items.find(i => i.dataset.label === 'control');
              const v = items.find(i => i.dataset.label === 'variant_a');
              if (!c || !v || !c.parsed.y) return '';
              const pct = Math.round(((v.parsed.y - c.parsed.y) / c.parsed.y) * 100);
              return (pct >= 0 ? '+' : '') + pct + '% vs control';
            },
          },
        },
      },
      scales: { y: { beginAtZero: true } },
    },
  });
}

function drawChart() {
  if (state.chart) { state.chart.destroy(); state.chart = null; }
  const canvas = document.getElementById('seriesChart');
  if (!canvas || !state.series.length) return;
  state.chart = new Chart(canvas, {
    type: 'line',
    data: {
      labels: state.series.map(s => s.date),
      datasets: [
        { label: 'control', data: state.series.map(s => s.control || 0), borderColor: VARIANT_COLORS.control, backgroundColor: 'transparent', tension: 0.3 },
        { label: 'variant_a', data: state.series.map(s => s.variant_a || 0), borderColor: VARIANT_COLORS.variant_a, backgroundColor: 'transparent', tension: 0.3 },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            afterBody: (items) => {
              const c = items.find(i => i.dataset.label === 'control');
              const v = items.find(i => i.dataset.label === 'variant_a');
              if (!c || !v || !c.parsed.y) return '';
              const pct = Math.round(((v.parsed.y - c.parsed.y) / c.parsed.y) * 100);
              return (pct >= 0 ? '+' : '') + pct + '% vs control';
            },
          },
        },
      },
      scales: { y: { beginAtZero: true } },
    },
  });
}

async function render() {
  const app = document.getElementById('app');
  app.innerHTML = state.view === 'picker' ? renderPicker() : renderTestDetail();
  wireEvents();
  if (state.view === 'test') { drawChart(); drawOverviewChart(); }
}

function wireEvents() {
  document.querySelectorAll('[data-open-test]').forEach(el => {
    el.addEventListener('click', async (ev) => {
      if (ev.target.closest('[data-edit-test]') || ev.target.closest('[data-delete-test]')) return;
      state.testId = el.getAttribute('data-open-test');
      state.view = 'test';
      state.showAddEvent = false;
      state.addEventProgression = [];
      await loadEventsForTest(state.testId);
      state.selectedEvent = state.events[0] ? state.events[0].name : null;
      if (state.selectedEvent) await loadFunnelAndSeries();
      await loadTestOverview();
      render();
    });
  });
  document.querySelectorAll('[data-edit-test]').forEach(el => {
    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      state.editingTestId = el.getAttribute('data-edit-test');
      state.showAddTest = false;
      state.addTestError = '';
      state.confirmingDeleteId = null;
      render();
    });
  });
  document.querySelectorAll('[data-delete-test]').forEach(el => {
    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      state.confirmingDeleteId = el.getAttribute('data-delete-test');
      state.editingTestId = null;
      state.showAddTest = false;
      render();
    });
  });
  const cancelDelete = document.querySelector('[data-cancel-delete-test]');
  if (cancelDelete) cancelDelete.addEventListener('click', (ev) => {
    ev.stopPropagation();
    state.confirmingDeleteId = null;
    render();
  });
  const confirmDelete = document.querySelector('[data-confirm-delete-test]');
  if (confirmDelete) confirmDelete.addEventListener('click', async (ev) => {
    ev.stopPropagation();
    const id = confirmDelete.getAttribute('data-confirm-delete-test');
    try {
      await deleteExperiment(id);
      state.confirmingDeleteId = null;
      await loadExperiments();
      render();
    } catch (e) {
      state.confirmingDeleteId = null;
      alert('Could not delete: ' + e.message);
      render();
    }
  });
  document.querySelectorAll('[data-select-event]').forEach(el => {
    el.addEventListener('click', async () => {
      state.selectedEvent = el.getAttribute('data-select-event');
      await loadFunnelAndSeries();
      render();
    });
  });
  document.querySelectorAll('[data-range]').forEach(el => {
    el.addEventListener('click', async () => {
      const rangeValue = el.getAttribute('data-range');
      state.rangeDays = rangeValue === 'today' ? 'today' : parseInt(rangeValue, 10);
      state.useCustomRange = false;
      await loadFunnelAndSeries();
      await loadTestOverview();
      render();
    });
  });
  const toggleCustomRange = document.querySelector('[data-toggle-custom-range]');
  if (toggleCustomRange) toggleCustomRange.addEventListener('click', async () => {
    state.useCustomRange = !state.useCustomRange;
    if (!state.useCustomRange) { await loadFunnelAndSeries(); await loadTestOverview(); }
    render();
  });
  const applyCustomRange = document.querySelector('[data-apply-custom-range]');
  if (applyCustomRange) applyCustomRange.addEventListener('click', async () => {
    state.customFrom = document.getElementById('customFromInput').value;
    state.customTo = document.getElementById('customToInput').value;
    if (!state.customFrom) return;
    await loadFunnelAndSeries();
    await loadTestOverview();
    render();
  });
  document.querySelectorAll('[data-device]').forEach(el => {
    el.addEventListener('click', async () => {
      state.device = el.getAttribute('data-device');
      await loadFunnelAndSeries();
      await loadTestOverview();
      render();
    });
  });
  const back = document.querySelector('[data-back]');
  if (back) back.addEventListener('click', () => { state.view = 'picker'; state.showAddEvent = false; render(); });

  const toggleAddTest = document.querySelector('[data-toggle-add-test]');
  if (toggleAddTest) toggleAddTest.addEventListener('click', () => {
    state.showAddTest = !state.showAddTest;
    state.editingTestId = null;
    state.addTestError = '';
    render();
  });

  const cancelTest = document.querySelector('[data-cancel-test]');
  if (cancelTest) cancelTest.addEventListener('click', () => {
    state.showAddTest = false;
    state.editingTestId = null;
    state.addTestError = '';
    render();
  });

  const saveTest = document.querySelector('[data-save-test]');
  if (saveTest) saveTest.addEventListener('click', async () => {
    const editId = saveTest.getAttribute('data-save-test');
    const name = document.getElementById('newTestName').value.trim();
    const key = document.getElementById('newTestKey').value.trim();
    if (!name || !key) { state.addTestError = 'Add a name and the Shoplift test ID before saving.'; render(); return; }
    try {
      if (editId) {
        await updateExperiment(editId, name, key);
      } else {
        await createExperiment(name, key);
      }
      state.showAddTest = false;
      state.editingTestId = null;
      state.addTestError = '';
      await loadExperiments();
      render();
    } catch (e) {
      state.addTestError = 'Could not save: ' + e.message;
      render();
    }
  });

  const toggleAddEvent = document.querySelector('[data-toggle-add-event]');
  if (toggleAddEvent) toggleAddEvent.addEventListener('click', () => { state.showAddEvent = !state.showAddEvent; state.addEventError = ''; render(); });

  const cancelEvent = document.querySelector('[data-cancel-event]');
  if (cancelEvent) cancelEvent.addEventListener('click', () => { state.showAddEvent = false; state.addEventError = ''; render(); });

  const typeSelect = document.getElementById('newEventType');
  if (typeSelect) typeSelect.addEventListener('change', () => { state.addEventType = typeSelect.value; render(); });

  document.querySelectorAll('[data-toggle-progression]').forEach(el => {
    el.addEventListener('click', () => {
      const name = el.getAttribute('data-toggle-progression');
      state.addEventProgression = state.addEventProgression.includes(name)
        ? state.addEventProgression.filter(s => s !== name)
        : [...state.addEventProgression, name];
      render();
    });
  });

  const saveEvent = document.querySelector('[data-save-event]');
  if (saveEvent) saveEvent.addEventListener('click', async () => {
    const name = document.getElementById('newEventName').value.trim();
    const target = document.getElementById('newEventTarget').value.trim();
    if (!name || !target) { state.addEventError = 'Add a name and a target before saving.'; render(); return; }
    try {
      await createTrackedEvent(state.testId, name, state.addEventType, target, state.addEventProgression);
      state.showAddEvent = false;
      state.addEventError = '';
      state.addEventProgression = [];
      await loadEventsForTest(state.testId);
      state.selectedEvent = name;
      await loadFunnelAndSeries();
      await loadTestOverview();
      render();
    } catch (e) {
      state.addEventError = 'Could not save: ' + e.message;
      render();
    }
  });
}

(async function init() {
  document.getElementById('app').innerHTML = '<p class="text-xs text-slate-400">Loading&hellip;</p>';
  try {
    await loadExperiments();
    render();
    subscribeRealtime();
  } catch (e) {
    document.getElementById('app').innerHTML = '<p class="text-xs text-rose-600">Could not reach Supabase: ' + e.message + '</p>';
  }
})();
</script>
</body>
</html>
